  <style>
    /* ============================================
       PROCESS PAGE — follows meet-marie layout
       ============================================ */

    .process-section {
      display: flex;
      gap: 2vw;
      height: calc(100vh - 64px - 4vw);
      margin: 2vw 2vw;
    }

    .process-photo {
      flex: 0 0 42%;
      width: 42%;
      max-width: 42%;
      background: #ddd8d0;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }

    .process-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .process-text {
      flex: 1;
      background: var(--accent-color, #dedad3);
      display: flex;
      align-items: center;
      padding: 4vw 6vw;
      border-top: 1px solid rgba(0,0,0,0.07);
      overflow-y: auto;
    }

    @media (min-width: 901px) {
      .process-text {
        align-items: flex-start;
        padding-top: 5vw;
      }

      .process-section.photo-right {
        flex-direction: row-reverse;
      }
    }

    .process-text-inner {
      max-width: 560px;
    }

    .process-rule {
      width: 100%;
      height: 1px;
      background: rgba(0,0,0,0.18);
      margin-bottom: 1.6rem;
    }

    .process-heading {
      font-family: var(--content-font-family, 'Velour', serif);
      font-weight: 700;
      font-size: clamp(calc(1.5rem * var(--text-scale)), calc(2.6vw * var(--text-scale)), calc(2.4rem * var(--text-scale)));
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--body-text-color, #111);
      margin-bottom: 1.2rem;
      line-height: 1.1;
    }

    .process-body {
      font-family: var(--content-font-family, 'Jost', sans-serif);
      font-weight: 300;
      font-size: clamp(calc(0.72rem * var(--text-scale)), calc(0.85vw * var(--text-scale)), calc(0.82rem * var(--text-scale)));
      line-height: 1.55;
      color: var(--body-text-color, #333);
      margin-bottom: 0.85rem;
    }

    .process-body:last-child { margin-bottom: 0; }

    /* Timeline steps */
    .process-steps {
      margin-top: 1.6rem;
    }

    .process-step {
      display: flex;
      align-items: flex-start;
      gap: 1.1rem;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .process-step:first-child {
      border-top: 1px solid rgba(0,0,0,0.1);
    }

    .step-num {
      font-family: 'Velour', serif;
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: rgba(0,0,0,0.3);
      min-width: 1.7rem;
      padding-top: 0.1rem;
      flex-shrink: 0;
    }

    .step-title {
      font-family: var(--content-font-family, 'Velour', serif);
      font-weight: 500;
      font-size: clamp(calc(0.7rem * var(--text-scale)), calc(0.85vw * var(--text-scale)), calc(0.78rem * var(--text-scale)));
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--body-text-color, #111);
      margin-bottom: 0.3rem;
    }

    .step-desc {
      font-family: var(--content-font-family, 'Jost', sans-serif);
      font-weight: 300;
      font-size: clamp(calc(0.72rem * var(--text-scale)), calc(0.85vw * var(--text-scale)), calc(0.8rem * var(--text-scale)));
      line-height: 1.5;
      color: var(--body-text-color, #555);
    }

    /* Investment bullet list */
    .process-list {
      list-style: none;
      margin-top: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .process-list li {
      font-family: var(--content-font-family, 'Jost', sans-serif);
      font-weight: 300;
      font-size: clamp(calc(0.72rem * var(--text-scale)), calc(0.85vw * var(--text-scale)), calc(0.82rem * var(--text-scale)));
      line-height: 1.5;
      color: var(--body-text-color, #333);
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
    }

    .process-list li::before {
      content: '—';
      color: rgba(0,0,0,0.3);
      flex-shrink: 0;
      font-weight: 200;
    }

    .price-from {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.4);
      margin-top: 1.6rem;
      margin-bottom: 0.4rem;
    }

    .price-figure {
      font-family: 'Velour', serif;
      font-weight: 300;
      font-size: clamp(1.9rem, 3vw, 3rem);
      letter-spacing: 0.02em;
      color: #111;
      line-height: 1;
    }

    .section-divider {
      display: none;
    }

    @media (max-width: 900px) {
      .process-section {
        flex-direction: column;
        gap: 0;
        height: auto;
        margin: 0;
      }
      .process-photo {
        flex: none;
        width: 100%;
        max-width: 100%;
        height: 65vw;
        min-height: 300px;
      }
      .process-section.photo-right {
        flex-direction: column;
      }
      .process-text {
        padding: 10vw 8vw;
      }
    }

  </style>
</head>

  <script src="../js/img.js"></script>

  <script>
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    // Renders a paragraph's own bold/italic formatting (from the CMS's
    // restricted markdown editor -- only bold/italic marks are ever
    // produced) as <strong>/<em>. Bold is replaced first so **x** can't
    // be misread as italic by the single-asterisk pass.
    function mdFormat(s) {
      return esc(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/_(.+?)_/g, '<em>$1</em>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }
    const PARA_FONTS = {
      playfair: "'Playfair Display', serif", montserrat: "'Montserrat', sans-serif",
      poppins: "'Poppins', sans-serif", merriweather: "'Merriweather', serif", lato: "'Lato', sans-serif"
    };
    const PARA_COLORS = {
      charcoal: '#333333', grey: '#555555', black: '#111111',
      white: '#ffffff', navy: '#001f3f', blue: '#0074d9',
      darkgreen: '#2d5016', green: '#2ecc40', red: '#ff4136', brown: '#8b4513'
    };
    const PARA_SIZES = { small: '0.9em', medium: '1em', large: '1.15em' };
    function stepText(item) { return typeof item === 'string' ? item : (item.text || ''); }
    function paraStyle(p) {
      if (typeof p === 'string' || !p) return '';
      const styles = [];
      if (PARA_FONTS[p.font_family]) styles.push('font-family: ' + PARA_FONTS[p.font_family]);
      if (p.text_color_custom) styles.push('color: ' + p.text_color_custom);
      else if (PARA_COLORS[p.text_color]) styles.push('color: ' + PARA_COLORS[p.text_color]);
      if (PARA_SIZES[p.text_size]) styles.push('font-size: ' + PARA_SIZES[p.text_size]);
      return styles.length ? ' style="' + styles.join('; ') + '"' : '';
    }
    const photoSizes = '(max-width: 900px) 100vw, 42vw';

    fetch('../_content/process.json')
      .then(res => res.json())
      .then(data => {
        if (data.accent_color) {
          document.documentElement.style.setProperty('--accent-color', data.accent_color);
        }
        const hmw = data.how_marie_works || {};
        const proc = data.process || {};
        const inv = data.investment || {};

        document.getElementById('process-main').innerHTML = `
          <section class="process-section">
            <div class="process-photo">
              <img ${imgAttrs(hmw.photo, photoSizes)} alt="Marie at work" />
            </div>
            <div class="process-text">
              <div class="process-text-inner">
                <div class="process-rule"></div>
                <h1 class="process-heading">${esc(hmw.heading || '')}</h1>
                ${(hmw.paragraphs || []).map(p => `<p class="process-body"${paraStyle(p)}>${mdFormat(stepText(p))}</p>`).join('')}
              </div>
            </div>
          </section>

          <div class="section-divider"></div>

          <section class="process-section photo-right">
            <div class="process-photo">
              <img ${imgAttrs(proc.photo, photoSizes)} alt="Marie painting" />
            </div>
            <div class="process-text">
              <div class="process-text-inner">
                <div class="process-rule"></div>
                <h2 class="process-heading">${esc(proc.heading || '')}</h2>
                <p class="process-body">${esc(proc.intro || '')}</p>
                <div class="process-steps">
                  ${(proc.steps || []).map((step, i) => `
                    <div class="process-step">
                      <span class="step-num">${String(i + 1).padStart(2, '0')}</span>
                      <div><p class="step-desc"${paraStyle(step)}>${mdFormat(stepText(step))}</p></div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </section>

          <div class="section-divider"></div>

          <section class="process-section">
            <div class="process-photo">
              <img ${imgAttrs(inv.photo, photoSizes)} alt="Finished wall painting" />
            </div>
            <div class="process-text">
              <div class="process-text-inner">
                <div class="process-rule"></div>
                <h2 class="process-heading">${esc(inv.heading || '')}</h2>
                <p class="process-body">${esc(inv.intro || '')}</p>
                <ul class="process-list">
                  ${(inv.points || []).map(point => `<li${paraStyle(point)}>${mdFormat(stepText(point))}</li>`).join('')}
                </ul>
              </div>
            </div>
          </section>
        `;
      });
  </script>
  <script src="../js/cart.js"></script>
