  <script>
    fetch('../_content/setup-instructions.json')
      .then(res => res.json())
      .then(data => {
        const setText = (id, value) => {
          const el = document.getElementById(id);
          el.textContent = value || '';
          el.hidden = !value;
        };
        const setImg = (id, path, w) => {
          const el = document.getElementById(id);
          if (!path) { el.hidden = true; return; }
          el.src = imgUrl(path, w);
          el.hidden = false;
        };
        setText('setup-eyebrow', data.eyebrow);
        setText('setup-heading', data.heading || 'Setup Instructions');
        setText('setup-intro', data.intro);
        setText('setup-closing', data.closing);
        setText('setup-closing-note', data.closing_note);
        setImg('setup-banner', data.header_image, 1600);
        setImg('setup-signature', data.signature, 400);

        const list = document.getElementById('setup-steps');
        list.innerHTML = '';
        (data.steps || []).forEach((step, i) => {
          const li = document.createElement('li');
          li.className = 'setup-step';
          const num = document.createElement('span');
          num.className = 'setup-step-num';
          num.textContent = String(i + 1).padStart(2, '0');
          const h2 = document.createElement('h2');
          h2.textContent = step.title || '';
          li.append(num, h2);
          String(step.text || '').split(/\n\s*\n/).forEach(para => {
            if (!para.trim()) return;
            const p = document.createElement('p');
            p.textContent = para.trim();
            li.appendChild(p);
          });
          list.appendChild(li);
        });
      });
  </script>
