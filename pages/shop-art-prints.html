  <style>
    body.shop-page { background: #dedad3; }
    /* Clears the fixed nav with breathing room above the heading */
    .shop-header { padding: 7.5rem 6vw 2rem; text-align: center; }
    @media (max-width: 768px) { .shop-header { padding-top: 6rem; } }
    .shop-header h1 {
      font-family: 'Velour', serif; font-weight: 700;
      font-size: clamp(1.6rem, 3vw, 3rem); letter-spacing: 0.2em;
      text-transform: uppercase; color: #111; margin: 0 0 0.6rem;
    }
    .shop-header p {
      font-family: 'Jost', sans-serif; font-weight: 300;
      font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; color: #888;
    }
    .shop-rule { width: 40px; height: 1px; background: #bbb; margin: 1.2rem auto; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
      padding: 2rem 6vw 6rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .tattoo-card {
      background: #fff; border-radius: 4px; padding: 1.5rem 1.5rem 1rem;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .tattoo-card-top { display: flex; flex-direction: column; flex: 1; }
    .tattoo-card:hover { transform: translateY(-4px); box-shadow: 0 8px 40px rgba(0,0,0,0.12); }
    .tattoo-card-img {
      width: 100%; aspect-ratio: 1/1;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .tattoo-card-img img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      filter: brightness(1);
    }
    .tattoo-card-name {
      font-family: 'Jost', sans-serif; font-weight: 300;
      font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: #888; text-align: center; margin: 0.8rem 0 0.3rem;
    }
    .tattoo-card-price {
      font-family: 'Jost', sans-serif; font-weight: 500;
      font-size: 0.85rem; letter-spacing: 0.08em;
      color: #111; text-align: center; margin-bottom: 0.6rem;
    }
    .tattoo-lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .tattoo-lightbox.open { display: flex; }
    .tattoo-lightbox-inner {
      background: #fff; padding: 3rem; max-width: 500px;
      width: 90vw; position: relative; border-radius: 4px;
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
    }
    .tattoo-lightbox-inner img { max-width: 100%; max-height: 50vh; object-fit: contain; filter: brightness(1); }
    .tattoo-lightbox-close {
      position: absolute; top: 1rem; right: 1.2rem;
      background: none; border: none; font-family: 'Jost', sans-serif;
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: #888; cursor: pointer;
    }
    .tattoo-lightbox-close:hover { color: #111; }
    .tattoo-lightbox-prev, .tattoo-lightbox-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: none; border: none; font-size: 1.4rem; color: #aaa; cursor: pointer;
    }
    .tattoo-lightbox-prev { left: -3.5rem; }
    .tattoo-lightbox-next { right: -3.5rem; }
    .tattoo-lightbox-prev:hover, .tattoo-lightbox-next:hover { color: #111; }

    /* Photo gallery: main print image plus Marie's extra photos (same look as the tattoo popup) */
    .popup-stage {
      position: relative; width: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .popup-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 2.2rem; height: 2.2rem; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15); background: rgba(255,255,255,0.85);
      color: #111; font-size: 1rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .popup-arrow:hover { background: #fff; border-color: #111; }
    .popup-arrow.prev { left: -0.6rem; }
    .popup-arrow.next { right: -0.6rem; }
    .popup-thumbs {
      display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;
    }
    .popup-arrow[hidden], .popup-thumbs[hidden] { display: none; }
    .popup-thumbs button {
      width: 3.2rem; height: 3.2rem; padding: 0; cursor: pointer;
      border: 1px solid transparent; background: #fff; border-radius: 2px;
      opacity: 0.6; transition: opacity 0.2s, border-color 0.2s;
    }
    .popup-thumbs button.active { opacity: 1; border-color: #111; }
    .popup-thumbs button:hover { opacity: 1; }
    .popup-thumbs img {
      width: 100%; height: 100%; object-fit: cover; display: block; max-height: none;
    }
    @media (max-width: 768px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; padding: 1rem 4vw 6rem; }
      .tattoo-lightbox-prev { left: 0.5rem; }
      .tattoo-lightbox-next { right: 0.5rem; }
      /* On phones the print-to-print arrows sit on top of the photo arrows */
      .tattoo-lightbox.has-gallery .tattoo-lightbox-prev,
      .tattoo-lightbox.has-gallery .tattoo-lightbox-next { display: none; }
    }
  </style>
</head>
<body class="worlds-page shop-page">
  <script>
    // Shop switched off in the CMS (Shop Settings > Shop is Live) -> back to the Coming Soon shop page.
    fetch('../_content/shop-settings.json').then(r => r.json()).then(d => { if (!d.is_live) location.replace('shop.html'); }).catch(() => {});
  </script>
  <nav class="nav" aria-label="Main navigation">
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span class="nav-toggle-bar"><span></span><span></span><span></span></span>
    </button>
    <a class="nav-logo" href="../index.html">Marie's Painted Worlds</a>
    <ul class="nav-links">
      <li><a href="about-marie.html">About Marie</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="process.html">Process</a></li>
      <li><a href="contact.html">Connect</a></li>
      <li>
        <button class="cart-icon-btn" aria-label="Open cart">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          Cart
          <span class="cart-badge">0</span>

  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer-header">
      <h2>Your Cart</h2>
      <button class="cart-close" id="cart-close">&#215; Close</button>
    </div>
    <div class="cart-drawer-items"></div>
    <div class="cart-drawer-footer">
      <div class="cart-total">
        <span class="cart-total-label">Total</span>
        <span class="cart-total-amount">€0.00</span>
      </div>
      <button class="cart-checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

  <div class="shop-header">
    <h1>Art Prints</h1>
    <div class="shop-rule"></div>
    <p>Explore Marie's Art Prints</p>
  </div>

  <div class="product-grid" id="print-grid"></div>

  <div class="tattoo-lightbox" id="product-lb">
    <div class="tattoo-lightbox-inner">
      <button class="tattoo-lightbox-close" onclick="closeLb()">&#215; Close</button>
      <button class="tattoo-lightbox-prev" onclick="shiftLb(-1)">&#8592;</button>
      <div class="popup-stage">
        <button class="popup-arrow prev" id="popup-prev" type="button" aria-label="Previous photo" hidden>&#8592;</button>
        <img id="lb-img" src="" alt="" />
        <button class="popup-arrow next" id="popup-next" type="button" aria-label="Next photo" hidden>&#8594;</button>
      </div>
      <div class="popup-thumbs" id="popup-thumbs" hidden></div>
      <div id="lb-name" style="font-family:'Jost',sans-serif;font-size:0.8rem;letter-spacing:0.12em;color:#111;text-transform:uppercase;"></div>
      <div id="lb-price" style="font-family:'Jost',sans-serif;font-size:0.9rem;font-weight:500;color:#111;"></div>
      <button id="lb-add-btn" class="add-to-cart-btn" style="width:100%;margin-top:0.5rem;">Add to Cart</button>
      <button class="tattoo-lightbox-next" onclick="shiftLb(1)">&#8594;</button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="legal-footer">
    <span><a href="contact.html">Connect</a> &nbsp;|&nbsp; <a href="terms.html">Terms of Service</a> &nbsp;|&nbsp; <a href="shipping-returns.html">Shipping &amp; Returns</a> &nbsp;|&nbsp; <a href="impressum.html">Impressum</a> &nbsp;|&nbsp; <a href="privacy.html">Privacy Policy</a></span>
    <span>© All Rights Reserved 2026. Marie Hartig Studio</span>
  </footer>

  <script src="../js/maintenance.js"></script>
  <script src="../js/img.js"></script>
  <script src="../js/site-design.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    let lbItems = [];
    let lbCur   = 0;
    const lb       = document.getElementById('product-lb');
    const lbImg    = document.getElementById('lb-img');
    const lbName   = document.getElementById('lb-name');
    const lbPrice  = document.getElementById('lb-price');
    const lbAddBtn = document.getElementById('lb-add-btn');
    const printGrid = document.getElementById('print-grid');
    const cardSizes = '(max-width: 768px) 50vw, 300px';

    fetch('../_content/shop-prints.json')
      .then(res => res.json())
      .then(data => {
        if (data.heading) document.querySelector('.shop-header h1').textContent = data.heading;
        lbItems = (data.prints || []).map((item, i) => ({ ...item, id: `print-${i}` }));
        lbItems.forEach((item, idx) => {
          const card = document.createElement('div');
          card.className = 'tattoo-card';
          card.innerHTML = `
            <div class="tattoo-card-top">
              <div class="tattoo-card-img" onclick="openLb(${idx})">
                <img ${imgAttrs(item.image, cardSizes)} alt="${item.name}" loading="lazy" />
              </div>
              <div class="tattoo-card-name">${item.name}</div>
              <div class="tattoo-card-price">€${item.price.toFixed(2)}</div>
            </div>
            <button class="add-to-cart-btn">Add to Cart</button>
          `;
          // Wired here rather than inline so names with apostrophes don't break it
          card.querySelector('.add-to-cart-btn').addEventListener('click', () =>
            Cart.addItem(item.id, item.name, item.price, item.image));
          printGrid.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Failed to load prints:', err);
        printGrid.innerHTML = '<p style="text-align:center;color:#888;">Unable to load products right now.</p>';
      });

    function openLb(i) {
      lbCur = i;
      renderLb();
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function renderLb() {
      const item = lbItems[lbCur];
      setPhotos(item);
      lbImg.alt           = item.name;
      lbName.textContent  = item.name;
      lbPrice.textContent = `€${item.price.toFixed(2)}`;
      // Close first so the lightbox doesn't sit over the cart drawer
      lbAddBtn.onclick    = () => { closeLb(); Cart.addItem(item.id, item.name, item.price, item.image); };
    }

    const popupPrev   = document.getElementById('popup-prev');
    const popupNext   = document.getElementById('popup-next');
    const popupThumbs = document.getElementById('popup-thumbs');
    let popupPhotos   = [];
    let popupPhotoIdx = 0;

    function showPhoto(i) {
      popupPhotoIdx = (i + popupPhotos.length) % popupPhotos.length;
      lbImg.src = imgUrl(popupPhotos[popupPhotoIdx], 1200);
      popupThumbs.querySelectorAll('button').forEach((b, j) => b.classList.toggle('active', j === popupPhotoIdx));
    }

    function setPhotos(item) {
      // Decap can store single-field list items as bare strings
      const extra = (item.gallery || []).map(g => typeof g === 'string' ? g : g && g.image).filter(Boolean);
      popupPhotos = [item.image, ...extra];
      const many = popupPhotos.length > 1;
      popupPrev.hidden = popupNext.hidden = popupThumbs.hidden = !many;
      lb.classList.toggle('has-gallery', many);
      popupThumbs.innerHTML = many ? popupPhotos.map((src, j) =>
        `<button type="button" data-i="${j}" aria-label="Photo ${j + 1}"><img src="${imgUrl(src, 160)}" alt="" /></button>`
      ).join('') : '';
      showPhoto(0);
    }

    popupPrev.addEventListener('click', () => showPhoto(popupPhotoIdx - 1));
    popupNext.addEventListener('click', () => showPhoto(popupPhotoIdx + 1));
    popupThumbs.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) showPhoto(+b.dataset.i);
    });

    function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
    function shiftLb(d) {
      lbCur = (lbCur + d + lbItems.length) % lbItems.length;
      renderLb();
    }

    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'ArrowLeft')  shiftLb(-1);
      if (e.key === 'ArrowRight') shiftLb(1);
      if (e.key === 'Escape')     closeLb();
    });
  </script>
</body>
</html>
