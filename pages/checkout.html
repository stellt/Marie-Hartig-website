<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Marie Hartig Studio</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .checkout-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 6vw 6rem;
    }
    .checkout-wrap h1 {
      font-family: 'Velour', serif; font-weight: 700;
      font-size: clamp(1.4rem, 2.6vw, 2rem); letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--white); margin: 0 0 2rem;
    }
    .checkout-back {
      display: inline-block;
      margin-bottom: 1.5rem;
      font-family: 'Jost', sans-serif; font-weight: 300;
      font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: #999; text-decoration: none;
    }
    .checkout-back:hover { color: var(--white); }
    .checkout-note {
      font-family: 'Jost', sans-serif; font-weight: 300;
      font-size: 0.9rem; color: #bbb; margin: 0 0 1.5rem;
    }
    .checkout-note:empty { display: none; }
    .checkout-status {
      font-family: 'Jost', sans-serif; font-weight: 300;
      font-size: 0.9rem; color: #f0a0a0; min-height: 1.2em; margin: 0 0 1rem;
    }
    .checkout-confirm {
      margin: auto; border: none; border-radius: 2px; padding: 2rem;
      width: min(92vw, 380px); background: #fff; color: #111;
      font-family: 'Jost', sans-serif; font-weight: 300; text-align: center;
    }
    .checkout-confirm::backdrop { background: rgba(0,0,0,0.6); }
    .checkout-confirm p { font-size: 0.95rem; margin: 0 0 0.5rem; }
    .checkout-confirm-total { font-weight: 500; }
    .checkout-confirm-total:empty { display: none; }
    .checkout-confirm form { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1.5rem; }
    .checkout-confirm button {
      width: 100%; padding: 1rem; border: 1px solid #111; border-radius: 2px;
      font-family: 'Jost', sans-serif; font-weight: 300;
      font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase; cursor: pointer;
    }
    .checkout-confirm button[value="yes"] { background: #111; color: #fff; }
    .checkout-confirm button[value="no"] { background: none; color: #111; }
  </style>
</head>
<body>
  <main class="checkout-wrap">
    <a class="checkout-back" href="shop.html" onclick="if (history.length > 1) { history.back(); return false; }">← Back</a>
    <h1>Checkout</h1>
    <p class="checkout-note" id="checkout-note"></p>
    <p class="checkout-status" id="checkout-status" role="alert"></p>
    <div id="checkout-form"></div>
    <dialog class="checkout-confirm" id="checkout-confirm">
      <p>Are you sure you want to complete your purchase?</p>
      <p class="checkout-confirm-total"></p>
      <form method="dialog">
        <button value="yes">Yes, confirm purchase</button>
        <button value="no">No, go back</button>
      </form>
    </dialog>
  </main>
  <script src="../js/checkout.js"></script>
  <script src="../js/maintenance.js"></script>
</body>
</html>
