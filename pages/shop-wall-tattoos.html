<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wall Tattoos — Marie Hartig Studio</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/worlds.css" />
  <link rel="stylesheet" href="../css/cart.css" />
  <style>
    body.shop-page { background: #dedad3; }
    .shop-header { padding: 4rem 6vw 2rem; text-align: center; }
    .shop-header h1 {
      font-family: 'Velour', serif; font-weight: 700;
      font-size: clamp(1.6rem, 3vw, 3rem); letter-spacing: 0.2em;
      text-transform: uppercase; color: #111; margin: 0 0 0.6rem;
    }
    .shop-header p {
      font-family: 'Jost', sans-serif; font-weight: 300;
      font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; color: #888;
    }
    .shop-rule { width: 40px; height: 1px; background: #bbb; margin: 1.2rem auto; }
    .tattoo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
      padding: 2rem 6vw 6rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .tattoo-card {
      background: #fff;
      border-radius: 4px;
      padding: 1.5rem 1.5rem 1rem;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tattoo-card-top {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .tattoo-card:hover { transform: translateY(-4px); box-shadow: 0 8px 40px rgba(0,0,0,0.12); }
    .tattoo-card-img {
      width: 100%;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tattoo-card-img img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .tattoo-card-name {
      font-family: 'Jost', sans-serif; font-weight: 300;
      font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: #888; text-align: center; margin: 0.8rem 0 0.3rem;
    }
    .tattoo-card-price {
      font-family: 'Jost', sans-serif; font-weight: 500;
      font-size: 0.85rem; letter-spacing: 0.08em;
      color: #111; text-align: center; margin-bottom: 0.6rem;
    }
    @media (max-width: 768px) {
      .tattoo-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; padding: 1rem 4vw 4rem; }
    }

    .compose-btn-wrap {
      text-align: center;
      margin: 0.5rem 0 2rem;
    }
    .compose-page-btn {
      display: inline-block;
      background: none;
      border: 1px solid #111;
      color: #111;
      padding: 0.8rem 2.4rem;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.68rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      transition: background 0.2s, color 0.2s;
    }
    .compose-page-btn:hover { background: #111; color: #fff; }
  </style>
</head>
<body class="worlds-page shop-page">
  <nav class="nav" aria-label="Main navigation">
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span class="nav-toggle-bar"><span></span><span></span><span></span></span>
    </button>
    <a class="nav-logo" href="../index.html">Marie's Painted Worlds</a>
    <ul class="nav-links">
      <li><a href="about-marie.html">About Marie</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="process.html">Process</a></li>
      <li><a href="contact.html">Connect</a></li>
      <li>
        <button class="cart-icon-btn" aria-label="Open cart">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          Cart
          <span class="cart-badge">0</span>
        </button>
      </li>
    </ul>
  </nav>
  <!-- Cart Overlay & Drawer -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer-header">
      <h2>Your Cart</h2>
      <button class="cart-close" id="cart-close">&#215; Close</button>
    </div>
    <div class="cart-drawer-items"></div>
    <div class="cart-drawer-footer">
      <div class="cart-total">
        <span class="cart-total-label">Total</span>
        <span class="cart-total-amount">€0.00</span>
      </div>
      <button class="cart-checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

  <div class="shop-header">
    <h1>Wall Tattoos</h1>
    <div class="shop-rule"></div>
    <p>Create your own Marie’s Painted world’s composition</p>
  </div>

  <div class="compose-btn-wrap">
    <a class="compose-page-btn" href="shop-compose.html">✦ &nbsp; Click Here for Custom Compositions</a>
  </div>

  <div class="tattoo-grid" id="tattoo-grid"></div>

  <script src="../js/maintenance.js"></script>
  <script src="../js/img.js"></script>
  <script src="../js/site-design.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const grid = document.getElementById('tattoo-grid');
    const cardSizes = '(max-width: 768px) 50vw, 300px';

    fetch('../_content/shop-tattoos.json')
      .then(res => res.json())
      .then(data => {
        if (data.heading) document.querySelector('.shop-header h1').textContent = data.heading;
        const items = data.tattoos || [];
        items.forEach((item, i) => {
          const card = document.createElement('div');
          card.className = 'tattoo-card';
          card.innerHTML = `
            <div class="tattoo-card-top">
              <div class="tattoo-card-img">
                <img ${imgAttrs(item.image, cardSizes)} alt="${item.name}" loading="lazy" />
              </div>
              <div class="tattoo-card-name">${item.name}</div>
              <div class="tattoo-card-price">€${item.price.toFixed(2)}</div>
            </div>
            <button class="add-to-cart-btn" onclick="Cart.addItem('tattoo-${i}', '${item.name}', ${item.price}, '${item.image}')">Add to Cart</button>
          `;
          grid.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Failed to load tattoos:', err);
        grid.innerHTML = '<p style="text-align:center;color:#888;">Unable to load products right now.</p>';
      });
  </script>
</body>
</html>
