  <!-- Cart Overlay & Drawer -->
  <div class="cart-overlay" id="cart-overlay"></div>

    <div class="cart-drawer-header">
      <h2>Your Cart</h2>

    <div class="cart-drawer-footer">

  <div class="collection-wrap">

    <div class="collection-info">

    <span><a href="../contact.html">Connect</a> &nbsp;|&nbsp; <a href="#">Terms of Service</a></span>
    <span>© All Rights Reserved 2026. Marie Hartig Studio</span>

  <div class="col-lightbox" id="col-lb">
    <button class="col-lightbox-close" onclick="closeLb()">✕ &nbsp; Close</button>
    <button class="col-lightbox-prev" onclick="shift(-1)">&#8592;</button>
    <img id="col-lb-img" src="" alt="" />
    <button class="col-lightbox-next" onclick="shift(1)">&#8594;</button>
  </div>

  <script src="../../js/maintenance.js"></script>
  <script src="../../js/img.js"></script>
  <script src="../../js/site-design.js"></script>
  <script src="../../js/portfolio-gate.js"></script>
  <script>
    const SLUG = location.pathname.split('/').pop().replace(/^collection-/, '').replace(/\.html$/, '');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Renders a paragraph's own bold/italic formatting (from the CMS's
    // restricted markdown editor -- only bold/italic marks are ever
    // produced) as <strong>/<em>. Bold is replaced first so **x** can't
    // be misread as italic by the single-asterisk pass.
    function mdFormat(s) {
      return esc(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/_(.+?)_/g, '<em>$1</em>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }

    const PARA_FONTS = {
      playfair: "'Playfair Display', serif", montserrat: "'Montserrat', sans-serif",
      poppins: "'Poppins', sans-serif", merriweather: "'Merriweather', serif", lato: "'Lato', sans-serif"
    };
    const PARA_COLORS = {
      charcoal: '#333333',
      grey: '#555555',
      black: '#111111',
      white: '#ffffff',
      navy: '#001f3f',
      blue: '#0074d9',
      darkgreen: '#2d5016',
      green: '#2ecc40',
      red: '#ff4136',
      brown: '#8b4513'
    };
    const PARA_SIZES = { small: '0.9em', medium: '1em', large: '1.15em' };
    const PARA_INDENTS = { small: '1.5em', medium: '3em', large: '4.5em' };
    const PARA_SPACING = { small: '1.4rem', medium: '2.4rem', large: '4rem' };

    // A paragraph may still be a bare string or a {text}-only object from
    // before per-paragraph styling existed -- never assume the new fields exist.
    function paraText(p) { return typeof p === 'string' ? p : (p.text || ''); }
    function paraStyle(p) {
      if (typeof p === 'string' || !p) return '';
      const styles = [];
      if (PARA_FONTS[p.font_family]) styles.push('font-family: ' + PARA_FONTS[p.font_family]);
      // Use custom hex color if provided, otherwise use preset color
      if (p.text_color_custom) styles.push('color: ' + p.text_color_custom);
      else if (PARA_COLORS[p.text_color]) styles.push('color: ' + PARA_COLORS[p.text_color]);
      if (PARA_SIZES[p.text_size]) styles.push('font-size: ' + PARA_SIZES[p.text_size]);
      if (PARA_INDENTS[p.indent]) styles.push('margin-left: ' + PARA_INDENTS[p.indent]);
      if (PARA_SPACING[p.spacing]) styles.push('margin-bottom: ' + PARA_SPACING[p.spacing]);
      return styles.length ? ' style="' + styles.join('; ') + '"' : '';
    }

    let imgs = [];
    let cur = 0;
    const lb = document.getElementById('col-lb');
    const lbImg = document.getElementById('col-lb-img');
    function openLb(i) { cur=i; lbImg.src=imgs[i].src; lb.classList.add('open'); document.body.style.overflow='hidden'; }
    function closeLb() { lb.classList.remove('open'); document.body.style.overflow=''; }
    function shift(d) { cur=(cur+d+imgs.length)%imgs.length; lbImg.src=imgs[cur].src; }
    document.getElementById('col-lb').addEventListener('click',e=>{if(e.target===e.currentTarget)closeLb();});
    document.addEventListener('keydown',e=>{
      if(!lb.classList.contains('open'))return;
      if(e.key==='ArrowRight')shift(1);
      if(e.key==='ArrowLeft')shift(-1);
      if(e.key==='Escape')closeLb();
    });

    function fitGrid() {
      const grid = document.querySelector('.collection-grid');
      const wrap = document.querySelector('.collection-wrap');
      if (!grid || !wrap) return;

      // On mobile, images stack one-per-row at natural height; let CSS handle it.
      if (window.innerWidth <= 768) {
        grid.style.gridTemplateRows = '';
        grid.style.gridAutoRows = '';
        return;
      }

      const items = grid.querySelectorAll('.collection-grid-item');
      const count = items.length;
      const cols = window.innerWidth <= 1024 ? 2 : 3;
      const rows = Math.ceil(count / cols);
      const availH = wrap.clientHeight;
      const rowH = Math.floor(availH / rows);
      grid.style.gridTemplateRows = `repeat(${rows}, ${rowH}px)`;
      grid.style.gridAutoRows = `${rowH}px`;
    }
    window.addEventListener('resize', fitGrid);

    Promise.all([
      fetch('../../_collections/' + SLUG + '.json').then(r => r.json()),
      fetch('../../_content/portfolio.json').then(r => r.json())
    ]).then(([data, portfolio]) => {
      document.title = data.title + ' — Marie Hartig Studio';
      document.getElementById('collection-title').textContent = data.title;
      if (data.accent_color) {
        document.documentElement.style.setProperty('--accent-color', data.accent_color);
      }
      if (data.lightbox_color) {
        document.documentElement.style.setProperty('--lightbox-color', data.lightbox_color);
      }

      const grid = document.getElementById('collection-grid');
      const gridSizes = '(max-width: 768px) 100vw, (max-width: 1024px) 50vw, 33vw';
      grid.innerHTML = (data.images || []).map(img => {
        const src = typeof img === 'string' ? img : img.image;
        return `<div class="collection-grid-item"><img ${imgAttrs(src, gridSizes)} alt="${esc(data.title)}" loading="lazy" /></div>`;
      }).join('');

      document.getElementById('collection-desc').innerHTML = (data.description || []).map(p =>
        `<p class="collection-desc"${paraStyle(p)}>${mdFormat(paraText(p))}</p>`
      ).join('');

      const metaEl = document.getElementById('collection-meta');
      metaEl.innerHTML = data.location
        ? `<div class="collection-meta-item">Location: ${esc(data.location)}</div>`
        : '';

      const list = portfolio.collections || [];
      const idx = list.findIndex(c => c.slug === SLUG);
      const prev = list[(idx - 1 + list.length) % list.length];
      const next = list[(idx + 1) % list.length];
      const navEl = document.getElementById('collection-nav');
      navEl.innerHTML =
        (prev ? `<a href="collection-${prev.slug}.html">← Previous</a>` : '') +
        (next ? `<a href="collection-${next.slug}.html">Next →</a>` : '');

      imgs = Array.from(document.querySelectorAll('.collection-grid-item img'));
      imgs.forEach((img, i) => img.parentElement.onclick = () => openLb(i));

      fitGrid();
    });
  </script>
  <script src="../../js/cart.js"></script>
  <script src="../../js/nav.js"></script>
</body>
</html>
