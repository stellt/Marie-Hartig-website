[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[functions.portfolio-gate]
  # Belt-and-suspenders alongside the static require() in portfolio-gate.js:
  # explicitly force this data file into the deployed function bundle.
  included_files = ["netlify/functions/_data/portfolio-access.json"]

[functions.create-checkout-session]
  # Belt-and-suspenders alongside the static require() calls in
  # create-checkout-session.js: explicitly force the shop data files (its
  # server-side price catalog) into the deployed function bundle.
  included_files = ["_content/shop-tattoos.json", "_content/shop-prints.json", "_content/shop-wallpapers.json", "_content/shop-settings.json"]

[functions.update-shipping]
  # Same reason: the shipping zones it prices from.
  included_files = ["_content/shop-settings.json"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Repo housekeeping files that publish = "." would otherwise serve as pages.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/compress_images.py"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tina/*"
  to = "/"
  status = 404
  force = true

# publish = "." serves the whole repo as static files, which means the raw
# source under netlify/functions/ (including the portfolio-access password
# list) would otherwise be directly downloadable at /netlify/functions/...
# This does NOT affect the real function invocation path, which is
# /.netlify/functions/... (leading dot) -- a different, Netlify-handled route
# that this redirect never touches.
[[redirects]]
  from = "/netlify/functions/*"
  to = "/"
  status = 404
  force = true
