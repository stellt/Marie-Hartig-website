backend:
  name: git-gateway
  branch: main
media_folder: /assets/images/portfolio
public_folder: /assets/images/portfolio
site_url: https://www.mariespaintedworlds.com
display_url: https://www.mariespaintedworlds.com
show_preview_links: true
netlify_cms_backend_name: git-gateway
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: collections
  label: Portfolio Collections
  label_singular: Collection
  folder: _collections
  create: true
  delete: true
  slug: '{{fields.slug}}'
  extension: json
  format: json
  fields:
  - label: Collection Title
    name: title
    widget: string
    hint: e.g. Urban Infinity Pool
  - label: Slug
    name: slug
    widget: string
    hint: Must match the slug used in the Portfolio Page order list, e.g. urban
  - label: Images
    name: images
    widget: list
    label_singular: Image
    summary: '{{fields.image}}'
    field:
      label: Image
      name: image
      widget: image
      media_folder: /assets/images/portfolio
      public_folder: /assets/images/portfolio
  - label: Description
    name: description
    widget: list
    label_singular: Paragraph
    summary: '{{fields.text}}'
    fields:
    - label: Text
      name: text
      widget: markdown
      buttons:
      - bold
      - italic
      editor_components: []
      modes:
      - rich_text
      hint: Select a word or sentence and click Bold to emphasize just that part.
    - label: Font
      name: font_family
      widget: select
      options:
      - label: Use Site Default
        value: default
      - label: Playfair Display
        value: playfair
      - label: Montserrat
        value: montserrat
      - label: Poppins
        value: poppins
      - label: Merriweather
        value: merriweather
      - label: Lato
        value: lato
      default: default
    - label: Size
      name: text_size
      widget: select
      options:
      - label: Use Site Default
        value: default
      - label: Small
        value: small
      - label: Medium
        value: medium
      - label: Large
        value: large
      default: default
    - label: Color
      name: text_color
      widget: select
      options:
      - label: Use Site Default
        value: default
      - label: Black
        value: black
      - label: Charcoal
        value: charcoal
      - label: Grey
        value: grey
      - label: White
        value: white
      - label: Navy Blue
        value: navy
      - label: Blue
        value: blue
      - label: Dark Green
        value: darkgreen
      - label: Green
        value: green
      - label: Red
        value: red
      - label: Brown
        value: brown
      default: default
    - label: Custom Color (Optional)
      name: text_color_custom
      widget: string
      required: false
      hint: 'Paste a hex color code here (e.g., #ffffff for white, #ff0000 for red)
        or leave blank'
    - label: Indent
      name: indent
      widget: select
      options:
      - label: No Indent
        value: default
      - label: Small
        value: small
      - label: Medium
        value: medium
      - label: Large
        value: large
      default: default
      hint: Pushes this paragraph in from the left edge.
    - label: Paragraph Spacing
      name: spacing
      widget: select
      options:
      - label: Use Site Default
        value: default
      - label: Small
        value: small
      - label: Medium
        value: medium
      - label: Large
        value: large
      default: default
      hint: Adds extra space below this paragraph, before the next one.
  - label: Location
    name: location
    widget: string
    required: false
  - label: Year
    name: year
    widget: string
    required: false
  - label: Type
    name: type
    widget: string
    required: false
  - label: Accent Panel Color
    name: accent_color
    widget: string
    required: false
    default: '#dedad3'
    pattern:
    - ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
    - 'Must be a hex color code, e.g. #dedad3'
    hint: The color behind the title/description panel on this collection's page.
      Leave blank to use the site's usual beige.
  - label: Lightbox Background Color
    name: lightbox_color
    widget: string
    required: false
    default: '#ffffff'
    pattern:
    - ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
    - 'Must be a hex color code, e.g. #ffffff'
    hint: The background behind a photo when you click it to view it full-size on
      this collection's page. Pick a LIGHT color — the close button and arrows are
      dark and become hard to see on a dark background.
