          - label: Poppins
            value: poppins
          - label: Merriweather
            value: merriweather
          - label: Lato
            value: lato
          default: default
        - label: Size
          name: text_size
          widget: select
          options:
          - label: Use Site Default
            value: default
          - label: Small
            value: small
          - label: Medium
            value: medium
          - label: Large
            value: large
          default: default
        - label: Color
          name: text_color
          widget: select
          options:
          - label: Use Site Default
            value: default
          - label: Black
            value: black
          - label: Charcoal
            value: charcoal
          - label: Grey
            value: grey
          - label: White
            value: white
          - label: Navy Blue
            value: navy
          - label: Blue
            value: blue
          - label: Dark Green
            value: darkgreen
          - label: Green
            value: green
          - label: Red
            value: red
          - label: Brown
            value: brown
          default: default
        - label: Custom Color (Optional)
          name: text_color_custom
          widget: string
          required: false
          hint: Paste a hex code here to override the color above, or leave blank.
        - label: Indent
          name: indent
          widget: select
          options:
          - label: No Indent
            value: default
          - label: Small
            value: small
          - label: Medium
            value: medium
          - label: Large
            value: large
          default: default
          hint: Pushes this paragraph in from the left edge.
        - label: Paragraph Spacing
          name: spacing
          widget: select
          options:
          - label: Use Site Default
            value: default
          - label: Small
            value: small
          - label: Medium
            value: medium
          - label: Large
            value: large
          default: default
          hint: Adds extra space below this paragraph, before the next one.
      - label: Sizes
        name: sizes
        widget: list
        required: false
        label_singular: Size
        summary: '{{fields.label}}'
        hint: The size option(s) a customer can pick in the popup. Leave empty to
          hide the size selector for this tattoo (e.g. while you're still confirming
          its size).
        fields:
        - label: Size Label
          name: label
          widget: string
          hint: e.g. 53 × 45 cm
        - label: Price for This Size (€)
          name: price
          widget: number
          value_type: float
          required: false
          hint: Leave blank to use this tattoo's own price above.
