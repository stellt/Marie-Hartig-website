<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marie Hartig Studio — Hand-Painted Murals &amp; Wall Art</title>
  <!-- SEO -->
  <meta name="description" content="Marie Hartig creates bespoke hand-painted murals and immersive wall paintings for private homes and architectural spaces. Also wall tattoos and art prints, shipped worldwide." />
  <link rel="canonical" href="https://www.mariespaintedworlds.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Marie Hartig Studio" />
  <meta property="og:title" content="Marie Hartig Studio — Hand-Painted Murals &amp; Wall Art" />
  <meta property="og:description" content="Marie Hartig creates bespoke hand-painted murals and immersive wall paintings for private homes and architectural spaces. Also wall tattoos and art prints, shipped worldwide." />
  <meta property="og:url" content="https://www.mariespaintedworlds.com/" />
  <meta property="og:image" content="https://www.mariespaintedworlds.com/assets/images/og-share.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"ProfessionalService","name":"Marie Hartig Studio","alternateName":"Marie's Painted Worlds",
   "description":"Bespoke hand-painted murals and wall paintings, wall tattoos and art prints by artist Marie Hartig.",
   "url":"https://www.mariespaintedworlds.com/","image":"https://www.mariespaintedworlds.com/assets/images/og-share.jpg",
   "email":"info@mariespaintedworlds.com","telephone":"+43 699 11325517","address":{"@type":"PostalAddress","addressCountry":"AT"},
   "founder":{"@type":"Person","name":"Marie Hartig","jobTitle":"Mural artist"},
   "sameAs":["https://instagram.com/mariehartigstudio","https://facebook.com/mariehartigstudio"]}
  </script>
  <!-- /SEO -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/slideshow.css" />
  <!-- Start fetching the slideshow's JS and data immediately instead of
       waiting for the browser to parse all the way down to the bottom of
       <body> -- shaves a full round-trip off how long the black loading
       background shows before the first photo can even start downloading. -->
  <link rel="preload" href="js/img.js" as="script" />
  <link rel="preload" href="js/site-design.js" as="script" />
  <link rel="preload" href="js/slideshow.js" as="script" />
  <link rel="preload" href="_content/slideshow-opening.json" as="fetch" crossorigin="anonymous" />
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <!-- Automated fullscreen slideshow — built by JS -->
  <section class="slideshow" aria-label="Portfolio slideshow"></section>

  <!-- Manual navigation -->
  <button class="slide-prev" aria-label="Previous slide">&#8249;</button>
  <button class="slide-next" aria-label="Next slide">&#8250;</button>

  <!-- Hero text — centered -->
  <div class="hero-overlay">
    <h1 class="hero-title">Marie Hartig Studio</h1>
    <div class="hero-divider"></div>
    <p class="hero-subtitle">
      <a href="pages/about.html">Explore Marie's Painted Worlds</a>
    </p>
    <a class="hero-enter" href="pages/about.html" aria-label="Enter Marie's Painted Worlds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </div>

  <!-- Slide counter — bottom right -->
  <div class="slide-counter" aria-live="polite"></div>

  <!-- Progress bar — bottom edge -->
  <div class="progress-bar" aria-hidden="true"></div>

  <script src="js/maintenance.js"></script>
  <script src="js/img.js"></script>
  <script src="js/site-design.js"></script>
  <script src="js/slideshow.js"></script>
  <script>
    // Redirect to admin after Netlify Identity invite confirmation
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</body>
</html>
